name: CI

on:
  push:
    branches: [spec-23, localhost-names]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The mise basepad is tested against. The floor it supports is `min_version` in its configs.
  MISE_VERSION: 2026.11.5
  # mise downloads tools (pitchfork, Neon's proxy) from GitHub releases; a token avoids anonymous
  # rate limits. While aysnc-labs/mise-binaries is private, this repo's own token can't read its
  # releases, so a MISE_BINARIES_TOKEN secret (read access to that repo's contents) is used if set.
  GITHUB_TOKEN: ${{ secrets.MISE_BINARIES_TOKEN || github.token }}

jobs:
  macos:
    name: CLI tests (macOS, as a user)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise
        # mise's own installer, which falls back to mise's mirror when a GitHub download fails.
        run: |
          curl -fsSL https://mise.run | MISE_VERSION="v$MISE_VERSION" MISE_QUIET=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - run: mise trust --quiet && mise install
      - name: Check access to Neon's proxy release
        run: |
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/aysnc-labs/mise-binaries/releases/tags/neon-proxy-fa50421; then
            echo "::warning::Can't read aysnc-labs/mise-binaries' release, so the postgres-neon tests are skipped. Add a MISE_BINARIES_TOKEN secret, or make that repo public."
            echo "BASEPAD_TEST_SKIP_NEON_PROXY=1" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run check

  linux-root:
    name: CLI tests (Linux, as root)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - run: apt-get update -qq && apt-get install -y -qq curl ca-certificates git xz-utils >/dev/null
      - uses: actions/checkout@v7
      - name: Install mise
        # mise's own installer, which falls back to mise's mirror when a GitHub download fails.
        run: |
          curl -fsSL https://mise.run | MISE_VERSION="v$MISE_VERSION" MISE_QUIET=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - run: mise trust --quiet && mise install
      - name: Check access to Neon's proxy release
        run: |
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/aysnc-labs/mise-binaries/releases/tags/neon-proxy-fa50421; then
            echo "::warning::Can't read aysnc-labs/mise-binaries' release, so the postgres-neon tests are skipped. Add a MISE_BINARIES_TOKEN secret, or make that repo public."
            echo "BASEPAD_TEST_SKIP_NEON_PROXY=1" >> "$GITHUB_ENV"
          fi
      - run: id -u && npm ci
      - run: npm run check
