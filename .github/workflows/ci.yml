name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The mise basepad is tested against. The floor it supports is MISE_MIN_VERSION in src/versions.ts.
  MISE_VERSION: 2026.11.5
  # mise downloads tools from GitHub releases; a token avoids anonymous rate limits.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  macos:
    name: Check (macOS, as a user)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml (node, pnpm).
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  linux-root:
    name: Check (Linux, as root)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      # An init as PID 1 reaps orphans. The default, `tail -f /dev/null`, leaves pitchfork's stopped
      # supervisor a zombie, and `supervisor stop` waits about 60 s for it to go.
      options: --init
    steps:
      - run: apt-get update -qq && apt-get install -y -qq curl ca-certificates git xz-utils >/dev/null
      - uses: actions/checkout@v7
      # The checkout is owned by the runner's user, not root; git refuses it otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Installs mise and the tools in mise.toml (node, pnpm).
      - uses: jdx/mise-action@v5
        with:
          version: ${{ env.MISE_VERSION }}
      - run: id -u && pnpm install --frozen-lockfile
      - run: pnpm check
