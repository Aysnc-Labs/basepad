name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC); also signs provenance.
  id-token: write

env:
  # The same mise as CI; it installs the node and pnpm in mise.toml.
  MISE_VERSION: 2026.11.5

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mise
        # mise's own installer, which falls back to mise's mirror when a GitHub download fails.
        run: |
          curl -fsSL https://mise.run | MISE_VERSION="v$MISE_VERSION" MISE_QUIET=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - run: mise trust --quiet && mise install
        env:
          # mise downloads tools from GitHub releases; a token avoids anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
      # The PR's CI already ran the full check; `prepare` builds dist.
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
