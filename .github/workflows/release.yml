name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  mode:
    name: Select mode
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - id: mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version Packages PR
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          script: pnpm changeset version

  publish:
    name: Publish to npm
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # npm trusted publishing (OIDC); also signs provenance: https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          script: pnpm changeset publish
          create-github-releases: true
